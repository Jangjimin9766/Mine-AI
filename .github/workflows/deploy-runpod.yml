name: Deploy to RunPod (Docker Only)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/core/**'
      - 'handler.py'
      - 'Dockerfile.serverless'
      - 'requirements.txt'
      - '.github/workflows/deploy-runpod.yml'

concurrency:
  group: runpod-deploy-main
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h

      - name: Checkout code
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$GIT_COMMIT"
          git checkout --detach FETCH_HEAD

      - name: Docker Buildx Setup
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.serverless
          push: true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            jiminjang/mine-ai-serverless:latest
            jiminjang/mine-ai-serverless:${{ github.sha }}
          cache-from: type=registry,ref=jiminjang/mine-ai-serverless:buildcache
          cache-to: type=registry,ref=jiminjang/mine-ai-serverless:buildcache,mode=max
