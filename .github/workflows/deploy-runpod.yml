name: Deploy to RunPod (Docker Only)
# trigger: touch to force rebuild when needed

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/core/**'
      - 'handler.py'
      - 'Dockerfile.serverless'
      - 'requirements.txt'
      - '.github/workflows/deploy-runpod.yml'

concurrency:
  group: runpod-deploy-main
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      # NOTE:
      # GitHub's action archive download (codeload.github.com) is intermittently failing for docker/* actions.
      # Keep this workflow self-contained by using the built-in Docker CLI on ubuntu-latest.
      - name: Docker Buildx Setup
        run: |
          docker version
          docker buildx version
          docker buildx create --name mine-builder --use || docker buildx use mine-builder
          docker buildx inspect --bootstrap

      - name: Docker Hub Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and Push (buildx)
        env:
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          docker buildx build \
            --file ./Dockerfile.serverless \
            --no-cache \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg GIT_COMMIT="$GIT_COMMIT" \
            --tag jiminjang/mine-ai-serverless:latest \
            --tag jiminjang/mine-ai-serverless:"$GIT_COMMIT" \
            --push \
            .

      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "🚀 RunPod Deployment"
          description: "Docker image build and push to `jiminjang/mine-ai-serverless:latest`"
          color: ${{ job.status == 'success' && '0x238636' || '0xDA3633' }}
