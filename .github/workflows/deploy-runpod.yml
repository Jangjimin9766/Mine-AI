name: Deploy to RunPod (Docker Only)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/core/**'
      - 'handler.py'
      - 'Dockerfile.serverless'
      - 'requirements.txt'
      - '.github/workflows/deploy-runpod.yml'

concurrency:
  group: runpod-deploy-main
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h

      - name: Checkout code
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$GIT_COMMIT"
          git checkout --detach FETCH_HEAD

      - name: Docker Buildx Setup
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.serverless
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            jiminjang/mine-ai-serverless:latest
            jiminjang/mine-ai-serverless:${{ github.sha }}
          cache-from: type=registry,ref=jiminjang/mine-ai-serverless:buildcache
          cache-to: type=registry,ref=jiminjang/mine-ai-serverless:buildcache,mode=max

      - name: Update RunPod template image
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: h7xk6t10nx
          IMAGE_NAME: jiminjang/mine-ai-serverless:${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api_key = os.environ["RUNPOD_API_KEY"]
          template_id = os.environ["RUNPOD_TEMPLATE_ID"]
          image_name = os.environ["IMAGE_NAME"]
          headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json",
          }

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read().decode("utf-8")
                  return json.loads(raw) if raw else {}

          templates = request(
              "GET",
              "https://rest.runpod.io/v1/templates?includeEndpointBoundTemplates=true",
          )
          template = next((item for item in templates if item.get("id") == template_id), None)
          if not template:
              raise RuntimeError(f"RunPod template not found: {template_id}")

          payload = {
              "name": template["name"],
              "imageName": image_name,
              "containerDiskInGb": template.get("containerDiskInGb", 5),
              "containerRegistryAuthId": template.get("containerRegistryAuthId"),
              "env": template.get("env") or [],
              "readme": template.get("readme") or "",
              "volumeMountPath": template.get("volumeMountPath") or "",
          }
          request(
              "POST",
              f"https://rest.runpod.io/v1/templates/{template_id}/update",
              payload,
          )
          print(f"Updated RunPod template {template_id} to {image_name}")
          PY
